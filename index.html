<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhóm 6 | Portal Thành Viên</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --primary: #3b82f6;
            --accent: #ec4899;
            --cyan: #06b6d4;
            --bg-main: #070a13;
            --bg-card: rgba(16, 22, 38, 0.75);
            --border: rgba(51, 65, 85, 0.6);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 50px 0;
            flex: 1;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(59, 130, 246, 0.15);
            color: var(--cyan);
            border: 1px solid rgba(6, 182, 212, 0.3);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--cyan), var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 15px;
        }

        .member-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
        }

        .member-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: 0.25s;
        }

        .member-card:hover {
            transform: translateY(-5px);
            border-color: var(--cyan);
            box-shadow: 0 10px 30px rgba(6, 182, 212, 0.2);
        }

        .avatar-circle {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--cyan));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
            color: #fff;
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        .member-name {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 20px;
            text-transform: capitalize;
        }

        .member-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 600;
            width: 100%;
            justify-content: center;
        }

        #loading {
            text-align: center;
            color: var(--text-muted);
            grid-column: 1 / -1;
            padding: 30px;
            font-size: 15px;
        }

        footer {
            border-top: 1px solid var(--border);
            padding: 20px 0;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div class="badge">
                <i class="fa-solid fa-users"></i> Nhóm 6 - UTH
            </div>
            <h1>BÀI TẬP GIỮA KÌ</h1>
            <p class="subtitle">Trường Đại học Giao thông Vận tải TP.HCM</p>
        </header>

        <section>
            <div class="member-grid" id="memberGrid">
                <div id="loading"><i class="fa-solid fa-spinner fa-spin"></i> Đang tự động quét danh sách thành viên...</div>
            </div>
        </section>
    </div>

    <footer>
        <p>&copy; 2026 Nhóm 6 - UTH</p>
    </footer>

    <script>
        async function loadMembers() {
            const grid = document.getElementById('memberGrid');
            const owner = 'nguyentrunghieu2024tn-code';
            const repo = 'nhom6';

            try {
                // Quét thẳng vào thư mục members/
                const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/members`);
                const items = await res.json();

                // Lọc lấy các thư mục bên trong members/
                const folders = items.filter(item => item.type === 'dir');

                grid.innerHTML = '';

                if (!folders || folders.length === 0) {
                    grid.innerHTML = '<p id="loading">Chưa tìm thấy thư mục thành viên nào trong mục members/.</p>';
                    return;
                }

                folders.forEach(folder => {
                    const rawName = folder.name;
                    // Chuyển dấu gạch dưới thành dấu cách hiển thị cho đẹp
                    const displayName = rawName.replace(/_/g, ' ');
                    
                    // Lấy chữ cái đầu làm avatar
                    const words = displayName.trim().split(' ');
                    let initials = '';
                    if (words.length >= 2) {
                        initials = (words[0][0] + words[words.length - 1][0]).toUpperCase();
                    } else {
                        initials = rawName.slice(0, 2).toUpperCase();
                    }

                    const card = document.createElement('div');
                    card.className = 'member-card';
                    card.innerHTML = `
                        <div class="avatar-circle">${initials}</div>
                        <h3 class="member-name">${displayName}</h3>
                        <a href="members/${rawName}/" class="member-btn">
                            <i class="fa-solid fa-user-tie"></i> Xem Portfolio
                        </a>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                grid.innerHTML = '<p id="loading">Không thể tải danh sách thành viên. Vui lòng kiểm tra lại.</p>';
            }
        }

        loadMembers();
    </script>
</body>

</html>
